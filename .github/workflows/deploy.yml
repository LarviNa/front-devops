name: Deploy Frontend to EC2

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1                   # Configura aquí tu región de AWS
  ECR_REPOSITORY: frontend-repo           # Nombre de tu repositorio en ECR

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Frecuente en AWS Academy
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Construir, etiquetar y subir imagen a Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Desplegar en EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_FRONTEND }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Autenticarse en ECR en la instancia EC2
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Detener y eliminar contenedor anterior si existe
          docker stop frontend-app || true
          docker rm frontend-app || true
          
          # Descargar nueva imagen
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          
          # Ejecutar el nuevo contenedor (Conectado a la red de backend si es necesario o exponiendo puerto)
          # Aquí mapeamos el puerto 80 del host al 5000 del contenedor
          docker run -d \
            --name frontend-app \
            --restart unless-stopped \
            -p 80:5000 \
            -e BACKEND_URL=http://${{ secrets.EC2_HOST_BACKEND }}:3000 \
            -e SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
